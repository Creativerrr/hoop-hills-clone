<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hoop Hills (clone) — Peaks &amp; Valleys of NBA Games</title>
  <link rel="stylesheet" href="styles/main.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.176/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.176/examples/jsm/",
        "d3": "https://cdn.jsdelivr.net/npm/d3@7/+esm"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- top-left: title + info card -->
  <header id="title">
    <h1>Hoop Hills</h1>
    <p class="subtitle">Explore the peaks and valleys of NBA games</p>
    <div id="info-card">
      This chart shows every moment a team was
      <b class="lead">leading</b> or <b class="trail">trailing</b> during the season
    </div>
    <button id="toggle-filters">HIDE FILTERS</button>
  </header>

  <!-- top-center: team vs opponent -->
  <div id="matchup">
    <div class="field">
      <label for="team">Your team</label>
      <select id="team"></select>
    </div>
    <span class="x">×</span>
    <div class="field">
      <label for="opponent">Opponent</label>
      <select id="opponent"></select>
    </div>
  </div>

  <!-- top-right: interactive ViewCube — drag to rotate, click a face to snap to a view -->
  <svg id="logo" viewBox="0 0 100 100" width="72" height="72" title="Drag to rotate · click a face for top / side / front view">
    <!-- light clickable faces (clean isometric cube: wider than tall, equal vertical edges) -->
    <polygon class="face face-top"   data-view="top"   points="50,20 87,35 50,50 13,35" />
    <polygon class="face face-front" data-view="front" points="87,35 87,65 50,80 50,50" />
    <polygon class="face face-side"  data-view="side"  points="13,35 50,50 50,80 13,65" />
    <!-- perspective "home": bold purple down-triangle on the top face -->
    <polygon class="home" data-view="perspective" points="38,27 62,27 50,47" />
    <!-- crisp outline -->
    <polygon class="edge" points="50,20 87,35 87,65 50,80 13,65 13,35" fill="none" />
    <polyline class="edge" points="13,35 50,50 87,35" fill="none" />
    <polyline class="edge" points="50,50 50,80" fill="none" />
  </svg>

  <!-- bottom-left: games / periods / rounds -->
  <div id="filters-left" class="panel">
    <div class="group">
      <label>Games</label>
      <div id="games" class="pills">
        <button data-result="won" class="on">Won</button>
        <button data-result="lost" class="on">Lost</button>
      </div>
    </div>
    <div class="group">
      <label>Periods</label>
      <div id="periods" class="pills">
        <button data-period="Q1" class="on">Q1</button>
        <button data-period="Q2" class="on">Q2</button>
        <button data-period="Q3" class="on">Q3</button>
        <button data-period="Q4" class="on">Q4</button>
        <button data-period="OT" class="on">OT</button>
      </div>
    </div>
    <div class="group">
      <label>Rounds</label>
      <div id="rounds" class="pills">
        <button data-round="RS" class="on">Regular Season</button>
        <button data-round="PI" class="on">Play-In</button>
        <button data-round="PO" class="on">Playoffs</button>
      </div>
    </div>
  </div>

  <!-- bottom-center: date slider -->
  <div id="dates">
    <div class="date-label">All dates</div>
    <input id="date-slider" type="range" min="0" max="100" value="100" />
  </div>

  <!-- bottom-right: count + season + sort -->
  <div id="filters-right">
    <div id="count">
      <div class="count-total"><span id="count-games">–</span></div>
      <div id="count-bar"><span id="bar-won"></span><span id="bar-lost"></span></div>
      <div class="count-split">
        <span class="won"><b id="count-won">–</b> won</span>
        <span class="lost"><b id="count-lost">–</b> lost</span>
      </div>
    </div>
    <div class="rb-row">
      <div class="field">
        <label for="season">Season</label>
        <select id="season"></select>
      </div>
      <div class="field">
        <label>Sort by</label>
        <div id="sortby" class="pills">
          <button data-sort="margin" class="on">Win Margin</button>
          <button data-sort="date">Date</button>
        </div>
      </div>
    </div>
    <div class="attribution">Fan-made clone. Data from basketball-reference.com</div>
  </div>

  <div id="annotations"></div>
  <div id="tooltip" hidden>
    <div class="tt-head"></div>
    <div class="tt-body"></div>
  </div>

  <script type="module" src="scripts/index.js"></script>
</body>
</html>
